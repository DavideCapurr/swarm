# Advisory floors for transitive packages we do not depend on directly.
#
# These live here, not in `package.json`, because pnpm 11 no longer reads the
# `pnpm` field of a manifest — an overrides block there is silently inert, which
# is how `pnpm audit --audit-level=high` stayed red while the repo looked
# remediated. Each entry is the version named by the advisory that flagged it,
# scoped per major line where a package ships more than one. Raise an entry to
# the new floor when an advisory moves; do not delete one to quiet the gate.
overrides:
  # GHSA on brace-expansion: 1.x and 5.x are both in the tree.
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  # nanoid 3.x arrives via postcss.
  nanoid@3: ^3.3.18
  postcss: ^8.5.18
  # sharp is optional for this app; its install script stays blocked below.
  sharp: ^0.35.0
  # undici is test-only, via jsdom. Stay on the 7.x major jsdom expects.
  undici: ^7.29.0

allowBuilds:
  # Keep install scripts blocked by default. `sharp` is optional for this app
  # and must not run its fallback build path during local setup.
  sharp: false
  # esbuild arrives via vite 7 (pulled by vitest). Its prebuilt binary is
  # provided by the platform-specific optional dep, so the postinstall stays
  # blocked — no install-time script execution.
  esbuild: false
  # Native resolver used by the Next/ESLint toolchain. This is the only
  # approved frontend postinstall in Phase 2.
  unrs-resolver: true
