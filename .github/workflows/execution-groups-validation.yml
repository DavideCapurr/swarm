name: execution-groups-validation

on:
  push:
    branches: ["agent/execution-groups"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Install deps
        run: uv sync --frozen --extra dev --extra mavlink --extra dji
      - name: Ruff import diagnostic
        run: uv run ruff check core/swarm_core/missions.py --fix --diff || true
      - name: Ruff
        run: uv run ruff check core orchestrator backend adapters
      - name: Mypy
        run: uv run mypy core adapters orchestrator sim backend
      - name: Execution group tests
        run: uv run pytest -q orchestrator/swarm_orchestrator/tests/test_execution_groups.py
      - name: Regression tests
        run: >-
          uv run pytest -q
          orchestrator/swarm_orchestrator/tests/test_orchestrator.py
          orchestrator/swarm_orchestrator/tests/test_bus_fleet.py
          backend/tests/test_mavlink_dynamic_reallocation.py
          orchestrator/swarm_orchestrator/tests/test_presence_bus.py
          adapters/tests/test_decision_authority_boundary.py
