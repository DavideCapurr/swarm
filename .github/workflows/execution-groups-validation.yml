name: execution-groups-validation

on:
  push:
    branches: ["agent/execution-groups"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Install deps
        run: uv sync --frozen --extra dev --extra mavlink --extra dji
      - name: Ruff
        run: uv run ruff check core orchestrator backend adapters sim swarm_os
      - name: Mypy
        run: uv run mypy core adapters orchestrator sim backend swarm_os
      - name: Execution group tests
        run: >-
          uv run pytest -q
          orchestrator/swarm_orchestrator/tests/test_execution_groups.py
          orchestrator/swarm_orchestrator/tests/test_presence_execution_groups.py
          swarm_os/tests/test_execution_group_projection.py
      - name: Regression tests
        run: >-
          uv run pytest -q
          orchestrator/swarm_orchestrator/tests/test_orchestrator.py
          orchestrator/swarm_orchestrator/tests/test_bus_fleet.py
          backend/tests/test_fleet.py
          backend/tests/test_mavlink_dynamic_reallocation.py
          backend/tests/test_console_truth_frames.py
          orchestrator/swarm_orchestrator/tests/test_presence_bus.py
          adapters/tests/test_decision_authority_boundary.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2 --activate
      - name: Install deps
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Type check
        run: corepack pnpm typecheck
      - name: Lint
        run: corepack pnpm lint
      - name: Intrusion Console tests
        run: corepack pnpm exec vitest run components/intrusion-demo/IntrusionResponseDemo.test.tsx
