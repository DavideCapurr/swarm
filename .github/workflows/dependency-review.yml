name: dependency-review

on:
  pull_request:

# Cancel an in-progress dependency review when a newer commit lands on
# the same PR ref. The newest commit's review still runs.
concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required by dependency-review-action to comment on the PR.
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dependency-review-action is free on public repos and requires GitHub
    # Advanced Security on private ones. On this private repo the action
    # errors with "Dependency review is not supported on this repository"
    # (GHAS / Dependency-graph not enabled), and the `repository.visibility`
    # guard did not reliably skip it. Gate on an explicit opt-in variable so
    # the job is deterministically skipped (neutral, not failing) until GHAS
    # is enabled and `ENABLE_DEPENDENCY_REVIEW` is set to "true" in repo vars.
    # Dependabot weekly + pnpm/pip audit in CI cover the same surface today.
    if: vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # actions/dependency-review-action@v4.3.1
      # Phase 0 posture: severity gate only. License deny-list will be added
      # in Phase 6 after legal review of the dep tree (likely deny AGPL/GPL
      # for shipped code; allow them for build-only tools).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
