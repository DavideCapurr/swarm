name: pr127-code-check

on:
  push:
    branches:
      - agent/demo-console-live-decisions

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.nvmrc
      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2 --activate
      - name: Install deps
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Type check
        run: corepack pnpm typecheck
      - name: ESLint
        run: corepack pnpm lint
      - name: Vitest
        run: corepack pnpm test

  python-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python deps
        run: uv sync --frozen --extra dev --extra mavlink --extra dji
      - name: Targeted truth-path tests
        run: >-
          uv run pytest -q
          backend/tests/test_console_truth_frames.py
          backend/tests/test_mavlink_dynamic_reallocation.py
          backend/tests/test_payload_runtime.py
          orchestrator/swarm_orchestrator/tests/test_presence_bus.py
          adapters/mavlink/tests/test_reach_adapter.py
