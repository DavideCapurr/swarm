name: payload-live-sitl-pr-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-payload-sitl:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      SWARM_ENV: dev
      SWARM_AUTH_DISABLED: "1"
      SWARM_VENDORS: mavlink
      MAVLINK_FLEET: mav-001=udpin:0.0.0.0:14541,mav-002=udpin:0.0.0.0:14542
      MAVLINK_MODEL: px4-iris-sitl
      SWARM_PRESENCE_RESPONSE: "1"
      SWARM_PRESENCE_MIN_CONFIDENCE: "0.85"
      SWARM_PRESENCE_HOLD_S: "1"
      MAVLINK_LIGHT_ACTUATOR_NUMBER: "1"
      MAVLINK_LIGHT_OUTPUT_CHANNEL: "5"
      SWARM_PRESENCE_SIMULATE_SPEAKER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev --extra mavlink --extra dji
      - name: Static check probe and runtime
        run: |
          uv run ruff check core adapters orchestrator backend scripts/phase10_payload_sitl_backend_probe.py
          uv run mypy core adapters orchestrator sim backend scripts/phase10_payload_sitl_backend_probe.py
      - name: Start two live PX4 v1.14 SITL vehicles
        run: |
          mkdir -p artifacts
          docker pull jonasvautherin/px4-gazebo-headless@sha256:77f11913cbb2c4e9147a0ec0fdc4318e9575515e20e88d1f3cd9a21470ddcd21
          docker run -d --name px4-multi --network host \
            --entrypoint /bin/bash \
            -e DISPLAY=:99 \
            jonasvautherin/px4-gazebo-headless@sha256:77f11913cbb2c4e9147a0ec0fdc4318e9575515e20e88d1f3cd9a21470ddcd21 \
            -lc 'rm -f /tmp/.X99-lock; Xvfb :99 -screen 0 1600x1200x24+32 & cd /root/Firmware && Tools/simulation/gazebo-classic/sitl_multiple_run.sh -m iris -n 2 -w empty'
          sleep 8
          docker ps -a --filter name=px4-multi
          if [ "$(docker inspect -f '{{.State.Running}}' px4-multi)" != "true" ]; then
            echo "PX4 multi-SITL container exited during startup" >&2
            docker logs px4-multi >&2 || true
            exit 1
          fi
      - name: Map MAIN5 to Offboard Actuator Set 1
        run: |
          uv run python - <<'PY'
          import struct
          import time
          from pymavlink import mavutil

          PARAM = "PWM_MAIN_FUNC5"
          DISABLED = 0
          OFFBOARD_ACTUATOR_SET_1 = 301

          def param_name(message):
              value = message.param_id
              if isinstance(value, bytes):
                  value = value.decode(errors="ignore")
              return str(value).rstrip("\x00")

          def decode_px4_int32(message):
              if message.param_type != mavutil.mavlink.MAV_PARAM_TYPE_INT32:
                  raise SystemExit(
                      f"{param_name(message)} has unexpected MAV_PARAM_TYPE={message.param_type}"
                  )
              return struct.unpack("<i", struct.pack("<f", float(message.param_value)))[0]

          def encode_px4_int32(value):
              return struct.unpack("<f", struct.pack("<i", int(value)))[0]

          def read_param(connection, target_system, timeout=5.0):
              connection.mav.param_request_read_send(
                  target_system,
                  1,
                  PARAM.encode(),
                  -1,
              )
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  message = connection.recv_match(
                      type="PARAM_VALUE", blocking=True, timeout=0.5
                  )
                  if message is not None and param_name(message) == PARAM:
                      return message
              return None

          def set_param(connection, target_system, value):
              connection.mav.param_set_send(
                  target_system,
                  1,
                  PARAM.encode(),
                  encode_px4_int32(value),
                  mavutil.mavlink.MAV_PARAM_TYPE_INT32,
              )
              deadline = time.monotonic() + 10.0
              while time.monotonic() < deadline:
                  message = connection.recv_match(
                      type="PARAM_VALUE", blocking=True, timeout=0.5
                  )
                  if message is None or param_name(message) != PARAM:
                      continue
                  if decode_px4_int32(message) == value:
                      return message
              return None

          for port in (14541, 14542):
              connection = mavutil.mavlink_connection(f"udpin:0.0.0.0:{port}")
              try:
                  heartbeat = connection.wait_heartbeat(timeout=90)
                  if heartbeat is None:
                      raise SystemExit(f"no PX4 heartbeat on UDP {port}")
                  target_system = connection.target_system
                  current_message = read_param(connection, target_system)
                  if current_message is None:
                      raise SystemExit(f"{PARAM} absent on PX4 sysid={target_system}")
                  current = decode_px4_int32(current_message)
                  if current not in {DISABLED, OFFBOARD_ACTUATOR_SET_1}:
                      raise SystemExit(
                          f"refusing to replace active {PARAM}={current} on PX4 sysid={target_system}"
                      )
                  confirmed = set_param(
                      connection,
                      target_system,
                      OFFBOARD_ACTUATOR_SET_1,
                  )
                  if confirmed is None:
                      raise SystemExit(
                          f"failed to map {PARAM}=301 on PX4 sysid={target_system}"
                      )
                  print(
                      f"PX4 sysid={target_system} mapped {PARAM}: "
                      f"{current} -> {decode_px4_int32(confirmed)}"
                  )
              finally:
                  connection.close()
          PY
      - name: Wait for both PX4 offboard heartbeats after configuration
        run: |
          uv run python - <<'PY'
          from pymavlink import mavutil

          for port in (14541, 14542):
              connection = mavutil.mavlink_connection(f"udpin:0.0.0.0:{port}")
              try:
                  heartbeat = connection.wait_heartbeat(timeout=90)
                  if heartbeat is None:
                      raise SystemExit(f"no PX4 heartbeat on UDP {port}")
                  print(
                      f"PX4 heartbeat port={port} "
                      f"sysid={connection.target_system} compid={connection.target_component}"
                  )
              finally:
                  connection.close()
          PY
      - name: Start real backend with bounded presence response
        run: |
          nohup uv run uvicorn backend.app.main:app \
            --host 127.0.0.1 --port 8765 \
            > artifacts/backend.log 2>&1 &
          echo $! > artifacts/backend.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 1 http://127.0.0.1:8765/health >/dev/null; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend never became healthy" >&2
          cat artifacts/backend.log >&2 || true
          exit 1
      - name: Run live payload response probe
        run: |
          uv run python scripts/phase10_payload_sitl_backend_probe.py \
            --redis-url "$REDIS_URL" \
            --expected-agents mav-001,mav-002 \
            --target-lat 47.3980 --target-lon 8.5460 \
            --confidence 0.95 \
            --timeout-s 120 \
            --json-out artifacts/phase10-payload-sitl-backend-probe.json
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker logs px4-multi > artifacts/px4-multi.log 2>&1 || true
          docker exec px4-multi bash -lc 'ss -lunp || true' > artifacts/px4-sockets.log 2>&1 || true
          docker exec px4-multi bash -lc 'for f in /root/Firmware/build/px4_sitl_default/rootfs/*/out.log; do echo "=== $f ==="; tail -200 "$f"; done' > artifacts/px4-instance-out.log 2>&1 || true
          docker exec px4-multi bash -lc 'for f in /root/Firmware/build/px4_sitl_default/rootfs/*/err.log; do echo "=== $f ==="; tail -200 "$f"; done' > artifacts/px4-instance-err.log 2>&1 || true
          if [ -f artifacts/backend.pid ]; then
            kill -TERM "$(cat artifacts/backend.pid)" || true
          fi
          docker rm -f px4-multi >/dev/null 2>&1 || true
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payload-live-sitl-validation
          path: |
            artifacts/phase10-payload-sitl-backend-probe.json
            artifacts/backend.log
            artifacts/px4-multi.log
            artifacts/px4-sockets.log
            artifacts/px4-instance-out.log
            artifacts/px4-instance-err.log
          if-no-files-found: warn
          retention-days: 30
