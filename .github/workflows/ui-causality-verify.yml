name: UI causality verification

on:
  push:
    branches:
      - ui/swarmos-operational-console-redesign
    paths:
      - "frontend/components/ops/OperationalConsole.tsx"
      - "frontend/components/ops/ObjectiveQueue.tsx"
      - "frontend/components/ops/OperationalInputCausality.test.tsx"
      - ".github/workflows/ui-causality-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2 --activate

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Run causality and operational console tests
        working-directory: frontend
        run: pnpm exec vitest run components/ops/OperationalInputCausality.test.tsx components/ops/OperationalConsole.test.tsx components/ops/OperationalNarrative.test.tsx lib/__tests__/mission-story.test.ts lib/__tests__/opsmap.test.ts

      - name: Install Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Start replay surface
        working-directory: frontend
        run: |
          pnpm dev --hostname 0.0.0.0 > /tmp/swarm-ui.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/dev/replay >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/swarm-ui.log
          exit 1

      - name: Capture causality frames at 2560x1440
        run: |
          mkdir -p artifacts/ui-causality
          npx -y playwright@1.55.0 screenshot --viewport-size="2560,1440" --wait-for-timeout=1600 "http://127.0.0.1:3000/dev/replay?at=2500" artifacts/ui-causality/01-input-to-objective.png
          npx -y playwright@1.55.0 screenshot --viewport-size="2560,1440" --wait-for-timeout=1600 "http://127.0.0.1:3000/dev/replay?at=25500" artifacts/ui-causality/02-second-input-busy.png

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: swarmos-input-causality-qa
          path: artifacts/ui-causality
          if-no-files-found: error
          retention-days: 7
