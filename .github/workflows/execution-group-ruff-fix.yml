name: execution-group-ruff-fix

on:
  push:
    branches: ["agent/execution-groups"]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Format execution group Python changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/execution-groups
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Apply Ruff safe fixes
        run: uvx ruff@0.15.13 check swarm_os/coordinator.py --fix
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add swarm_os/coordinator.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format execution group Python changes"
          git push origin HEAD:agent/execution-groups
