name: execution-groups-sitl

on:
  push:
    branches: ["agent/execution-groups"]

permissions:
  contents: read

jobs:
  four-px4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      SWARM_ENV: dev
      SWARM_AUTH_DISABLED: "1"
      SWARM_VENDORS: mavlink
      MAVLINK_FLEET: mav-001=udpin:0.0.0.0:14541,mav-002=udpin:0.0.0.0:14542,mav-003=udpin:0.0.0.0:14543,mav-004=udpin:0.0.0.0:14544
      MAVLINK_MODEL: px4-iris-sitl
      SWARM_COOPERATIVE_VERIFY: "1"
      SWARM_COOPERATIVE_VERIFY_MIN_CONFIDENCE: "0.90"
      SWARM_COOPERATIVE_VERIFY_TEAM_SIZE: "3"
      SWARM_PROBE_OUTPUT: artifacts/execution-group-sitl-proof.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Install SWARM runtime
        run: uv sync --frozen --extra dev --extra mavlink
      - name: Start four PX4 SITL instances
        run: |
          mkdir -p artifacts
          IMAGE='jonasvautherin/px4-gazebo-headless@sha256:77f11913cbb2c4e9147a0ec0fdc4318e9575515e20e88d1f3cd9a21470ddcd21'
          docker pull "$IMAGE"
          docker run -d --name px4-execution-group --network host \
            --entrypoint /bin/bash \
            -e DISPLAY=:99 \
            "$IMAGE" \
            -lc 'rm -f /tmp/.X99-lock; Xvfb :99 -screen 0 1600x1200x24+32 & cd /root/Firmware && Tools/simulation/gazebo-classic/sitl_multiple_run.sh -m iris -n 4 -w empty' \
            > artifacts/px4-container-id.txt
      - name: Require four independent PX4 heartbeats
        run: |
          uv run python - <<'PY'
          from pymavlink import mavutil

          for expected_index, port in enumerate((14541, 14542, 14543, 14544), start=1):
              conn = mavutil.mavlink_connection(f"udpin:0.0.0.0:{port}")
              heartbeat = conn.wait_heartbeat(timeout=120)
              if heartbeat is None:
                  raise SystemExit(f"no PX4 heartbeat on UDP {port}")
              print(
                  "PX4_HEARTBEAT",
                  expected_index,
                  "port",
                  port,
                  "sysid",
                  heartbeat.get_srcSystem(),
              )
              conn.close()
          PY
      - name: Start SWARM backend and real MAVLink fleet runtime
        run: |
          nohup uv run uvicorn backend.app.main:app --host 127.0.0.1 --port 8765 \
            > artifacts/backend.log 2>&1 &
          echo $! > artifacts/backend.pid
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/health.json; then
              cat artifacts/health.json
              exit 0
            fi
            if ! kill -0 "$(cat artifacts/backend.pid)" 2>/dev/null; then
              echo 'backend exited early'
              cat artifacts/backend.log
              exit 1
            fi
            sleep 1
          done
          echo 'backend readiness timed out'
          cat artifacts/backend.log
          exit 1
      - name: Prove one objective executes across three PX4 with one spare
        run: uv run python scripts/execution_group_sitl_probe.py
      - name: Print validation evidence
        if: always()
        run: |
          echo '=== EXECUTION GROUP PROOF ==='
          test -f artifacts/execution-group-sitl-proof.json && cat artifacts/execution-group-sitl-proof.json || true
          echo '=== BACKEND LOG TAIL ==='
          test -f artifacts/backend.log && tail -n 250 artifacts/backend.log || true
          echo '=== PX4 LOG TAIL ==='
          docker logs --tail 300 px4-execution-group 2>&1 || true
      - name: Cleanup
        if: always()
        run: |
          if test -f artifacts/backend.pid; then kill "$(cat artifacts/backend.pid)" 2>/dev/null || true; fi
          docker rm -f px4-execution-group 2>/dev/null || true
