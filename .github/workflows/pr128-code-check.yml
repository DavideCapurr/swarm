name: pr128-code-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Install deps
        run: uv sync --frozen --extra dev --extra mavlink --extra dji
      - name: Ruff
        run: uv run ruff check . --output-format=github
      - name: Mypy
        run: uv run mypy core adapters orchestrator sim backend
      - name: Adapter authority boundary
        run: uv run pytest adapters/tests/test_decision_authority_boundary.py -q
      - name: Allocator regression
        run: uv run pytest core/swarm_core/tests/test_allocator.py -q
      - name: Dynamic reallocation regression
        run: uv run pytest backend/tests/test_mavlink_dynamic_reallocation.py -q
      - name: Console truth regression
        run: uv run pytest backend/tests/test_console_truth_frames.py -q
      - name: Presence response regression
        run: uv run pytest orchestrator/swarm_orchestrator/tests/test_presence_bus.py -q
