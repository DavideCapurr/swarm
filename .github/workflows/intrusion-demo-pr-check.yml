name: intrusion-demo-pr-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.nvmrc
      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2 --activate
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: ESLint
        run: corepack pnpm lint
      - name: Intrusion demo tests
        run: corepack pnpm exec vitest run components/intrusion-demo/IntrusionResponseDemo.test.tsx
      - name: Production build
        run: corepack pnpm build
