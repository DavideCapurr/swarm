name: final-demo-live-temp

on:
  push:
    branches:
      - agent/final-demo-rehearsal

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      SWARM_ENV: dev
      SWARM_ALLOWED_ORIGINS: http://localhost:3000
      SWARM_VENDORS: mavlink
      MAVLINK_FLEET: mav-001=udpin:0.0.0.0:14541,mav-002=udpin:0.0.0.0:14542
      MAVLINK_MODEL: px4-iris-sitl
      SWARM_PRESENCE_RESPONSE: 1
      SWARM_PRESENCE_MIN_CONFIDENCE: 0.85
      SWARM_PRESENCE_HOLD_S: 20
      MAVLINK_LIGHT_ACTUATOR_NUMBER: 1
      MAVLINK_LIGHT_OUTPUT_CHANNEL: 5
      SWARM_PRESENCE_SIMULATE_SPEAKER: 1
      SWARM_COOPERATIVE_VERIFY: 0
      NEXT_PUBLIC_API_URL: http://localhost:8765
      NEXT_PUBLIC_WS_URL: ws://localhost:8765/ws/telemetry

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --extra mavlink --extra dji
          uv run ruff check scripts/final_demo_rehearsal_probe.py scripts/configure_px4_payload_output.py
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0
          pnpm exec playwright install chromium

      - name: Bootstrap auth
        run: |
          make bootstrap-auth-dev
          secret="$(sed -n 's/^SWARM_JWT_SECRET=//p' .env | tail -1)"
          test -n "$secret"
          echo "SWARM_JWT_SECRET=$secret" >> "$GITHUB_ENV"
          echo "SWARM_OPERATORS_CONFIG=$GITHUB_WORKSPACE/infra/config/operators.yaml" >> "$GITHUB_ENV"

      - name: Start Console and write disposable observer
        run: |
          cat > frontend/final-demo-live.temp.spec.ts <<'TS'
          import { expect, test } from "@playwright/test";

          test("authenticated Console renders authoritative final demo flow", async ({ page }) => {
            test.setTimeout(150_000);
            page.on("console", (message) => console.log(`browser:${message.type()}: ${message.text()}`));
            page.on("websocket", (ws) => console.log(`browser:websocket: ${ws.url()}`));

            await page.goto("http://localhost:3000/login?next=/demo/intrusion");
            await page.getByTestId("login-operator-id").fill("op-viewer01");
            await page.getByTestId("login-password").fill("swarm-dev");
            await page.getByTestId("login-submit").click();
            await expect(page).toHaveURL(/\/demo\/intrusion$/, { timeout: 15_000 });
            await expect(page.getByText("CONNECTED", { exact: true })).toBeVisible({ timeout: 20_000 });

            await expect(page.getByText("INTRUSION DETECTED")).toBeVisible({ timeout: 45_000 });
            await expect(page.getByText("Fleet auction")).toBeVisible();
            await expect(page.getByText("SERVER REASONS")).toBeVisible();
            await expect(page.getByText("WINNER", { exact: true })).toBeVisible();

            await expect(page.getByText("MISSION_ITEM_REACHED").first()).toBeVisible({ timeout: 60_000 });
            await expect(page.getByText("LIGHT ON")).toBeVisible({ timeout: 20_000 });
            await expect(page.getByText("PX4 OUTPUT CONFIRMED").first()).toBeVisible();
            await expect(page.getByText("SPEAKER ACTIVE")).toBeVisible();
            await expect(page.getByText("SIMULATED", { exact: true }).first()).toBeVisible();

            const missions = page.locator('[data-testid^="mission-"]');
            await expect(missions).toHaveCount(2, { timeout: 40_000 });
            await expect(missions.filter({ hasText: "owner mav-002" })).toHaveCount(1);
            await expect(missions.filter({ hasText: "owner mav-001" })).toHaveCount(1);
            await expect(page.getByText("LIGHT OFF")).toHaveCount(0);

            const busy = page.getByTestId("excluded-mav-002");
            await expect(busy).toBeVisible();
            await expect(busy).toContainText("EXCLUDED");
            await expect(busy).toContainText("BUSY");
            await expect(busy).toContainText("mission");
            await expect(page.getByText("ELIGIBLE", { exact: true }).first()).toBeVisible();

            await expect(page.getByText("LIGHT OFF")).toBeVisible({ timeout: 45_000 });
            await expect(page.getByText("SPEAKER STOPPED")).toBeVisible();
            await expect(page.getByText("RTL COMMAND ACKNOWLEDGED").first()).toBeVisible({ timeout: 60_000 });
          });
          TS

          nohup bash -lc 'cd frontend && pnpm dev --hostname localhost' > frontend-final-demo.log 2>&1 &
          echo $! > frontend-final-demo.pid
          for i in $(seq 1 60); do
            curl -fsS --max-time 1 http://localhost:3000/demo/intrusion >/dev/null && exit 0
            sleep 1
          done
          cat frontend-final-demo.log >&2
          exit 1

      - name: Pull pinned PX4 image
        run: docker pull jonasvautherin/px4-gazebo-headless@sha256:77f11913cbb2c4e9147a0ec0fdc4318e9575515e20e88d1f3cd9a21470ddcd21

      - name: Three consecutive clean takes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          cleanup() {
            if [ -f artifacts/backend.pid ]; then
              kill -TERM "$(cat artifacts/backend.pid)" >/dev/null 2>&1 || true
              rm -f artifacts/backend.pid
            fi
            docker rm -f px4-final-demo >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          reset_redis() {
            uv run python - <<'PY'
          import os
          import redis
          client = redis.Redis.from_url(os.environ["REDIS_URL"])
          client.flushall()
          client.close()
          PY
          }

          run_take() {
            local take="$1"
            echo "========== FINAL LIVE TAKE ${take} =========="
            cleanup
            reset_redis

            docker run -d --name px4-final-demo --network host \
              --entrypoint /bin/bash -e DISPLAY=:99 \
              jonasvautherin/px4-gazebo-headless@sha256:77f11913cbb2c4e9147a0ec0fdc4318e9575515e20e88d1f3cd9a21470ddcd21 \
              -lc 'rm -f /tmp/.X99-lock; Xvfb :99 -screen 0 1600x1200x24+32 & cd /root/Firmware && Tools/simulation/gazebo-classic/sitl_multiple_run.sh -m iris -n 2 -w empty' \
              >/dev/null
            sleep 8
            test "$(docker inspect -f '{{.State.Running}}' px4-final-demo)" = true

            uv run python scripts/configure_px4_payload_output.py \
              --connections udpin:0.0.0.0:14541,udpin:0.0.0.0:14542 \
              --output-channel 5

            nohup uv run uvicorn backend.app.main:app --host 127.0.0.1 --port 8765 \
              > "artifacts/backend-take-${take}.log" 2>&1 &
            echo $! > artifacts/backend.pid
            for i in $(seq 1 60); do
              curl -fsS --max-time 1 http://localhost:8765/health >/dev/null && break
              if [ "$i" -eq 60 ]; then cat "artifacts/backend-take-${take}.log" >&2; return 1; fi
              sleep 1
            done

            curl -fsS -H 'Content-Type: application/json' \
              -d '{"operator_id":"op-viewer01","password":"swarm-dev"}' \
              http://localhost:8765/auth/login > "artifacts/login-take-${take}.json"
            token="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["access_token"])' "artifacts/login-take-${take}.json")"
            curl -fsS -H "Authorization: Bearer ${token}" http://localhost:8765/allocations >/dev/null

            (cd frontend && pnpm exec playwright test final-demo-live.temp.spec.ts --reporter=line \
              > "../artifacts/browser-take-${take}.log" 2>&1) &
            browser_pid=$!
            sleep 4

            set +e
            uv run python scripts/final_demo_rehearsal_probe.py \
              --redis-url "$REDIS_URL" \
              --expected-agents mav-001,mav-002 \
              --timeout-s 220 \
              --json-out "artifacts/final-demo-take-${take}.json"
            probe_status=$?
            wait "$browser_pid"
            browser_status=$?
            set -e

            docker logs px4-final-demo > "artifacts/px4-take-${take}.log" 2>&1 || true
            docker exec px4-final-demo bash -lc \
              'for f in /root/Firmware/build/px4_sitl_default/rootfs/*/out.log; do echo "=== $f ==="; tail -200 "$f"; done' \
              > "artifacts/px4-instance-out-take-${take}.log" 2>&1 || true

            if [ "$probe_status" -ne 0 ] || [ "$browser_status" -ne 0 ]; then
              echo "probe_status=$probe_status browser_status=$browser_status" >&2
              cat "artifacts/browser-take-${take}.log" >&2 || true
              cat "artifacts/backend-take-${take}.log" >&2 || true
              return 1
            fi
            cleanup
            sleep 2
          }

          run_take 1
          run_take 2
          run_take 3

          python - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for take in (1, 2, 3):
              data = json.loads(Path(f"artifacts/final-demo-take-{take}.json").read_text())
              rows.append({
                  "take": take,
                  "status": data["status"],
                  "duration_s": data["duration_s"],
                  "mission_1": data["mission_1"],
                  "mission_2": data["mission_2"],
                  "auth": "pass",
                  "browser": "pass",
              })
          assert all(row["status"] == "pass" for row in rows)
          Path("artifacts/final-demo-summary.json").write_text(json.dumps(rows, indent=2) + "\n")
          print(json.dumps(rows, indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-demo-live-rehearsal
          path: |
            artifacts/
            frontend-final-demo.log
          retention-days: 30
